spring.application.name=sudokuWebApp
spring.data.mongodb.uri=${SUDOKU_MONGO_DB_URI}
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
spring.data.mongodb.database=sudokuDb

# Same env var name must be set wherever this app runs (local .env, Docker, Render, etc.)
jwt.secret=${SUDOKU_JWT_SECRET:devOnlyDefaultSecretKeyForLocalTestingChangeMeXXXXXXXXXXXXXXXXXX}

# Guest-session cookie's Secure flag - must be true wherever the app is served over HTTPS
# (e.g. Render), since browsers drop Secure cookies on plain HTTP (local dev).
cookie.secure=${COOKIE_SECURE:false}

# Unused by the Sudoku feature; only needed if the pre-existing image-upload/notification
# feature is actually used. Defaults let the app boot without real Cloudinary credentials.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:not-configured}
cloudinary.api-key=${CLOUDINARY_API_KEY:not-configured}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:not-configured}
