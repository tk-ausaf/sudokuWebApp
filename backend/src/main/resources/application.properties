spring.application.name=sudokuWebApp
spring.data.mongodb.uri=${SUDOKU_MONGO_DB_URI}
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
spring.data.mongodb.database=sudokuDb

# Same env var name must be set wherever this app runs (local .env, Docker, Render, etc.) -
# required, no fallback, so a deployment missing it fails to start instead of silently signing
# real users' JWTs with a well-known placeholder key.
jwt.secret=${SUDOKU_JWT_SECRET}


# App code logs at INFO by default in production; override per-deployment without a redeploy
# (e.g. LOG_LEVEL=DEBUG to troubleshoot). Spring/Tomcat startup logs stay at their own default
# (INFO) so a deploy's success/failure is still visible; only the driver's very chatty per-command
# connection-pool logging is turned down.
logging.level.com.ausaf.sudoku=${LOG_LEVEL:INFO}
logging.level.org.mongodb.driver=WARN

# Google OAuth2 login (project sudokubattle-508816). authorization-uri/token-uri/jwk-set-uri/
# user-info-uri all come from Spring's built-in Google provider preset, which already matches
# this project's console values - only the app-specific registration needs configuring here.
# The console's redirect URI is fixed to {baseUrl}/authCallback (not Spring's default
# /login/oauth2/code/google), so it must be set explicitly and matched in SecurityConfig's
# oauth2Login().redirectionEndpoint(). Client id/secret must never be committed - set the env
# vars wherever this app runs (local .env, Render, etc.).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/authCallback

# Password-reset emails, sent via a Gmail account through Gmail's SMTP relay. GMAIL_APP_PASSWORD
# must be a Google-generated app password (Google Account > Security > App passwords), not the
# account's real login password - Gmail rejects plain-password SMTP auth outright.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast on a connectivity problem (e.g. an outbound network path issue) instead of hanging
# on the OS's default TCP timeout, which can be a minute or more.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Origin used to build the password-reset link emailed to users, and to redirect back to after a
# Google OAuth2 login - always the frontend's own deployed origin, never this backend's own (they
# are two separately deployed services/domains, in both prod and local dev).
app.base-url=${APP_BASE_URL:http://localhost:5173}
