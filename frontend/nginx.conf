server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route without a matching static file (e.g. /resume/abc123,
    # /multiplayer/game/xyz) serves index.html so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}